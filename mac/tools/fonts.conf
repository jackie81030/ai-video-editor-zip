<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 給內建 ffmpeg 用（Mac）：沒有這份，drawtext 會一直印 Fontconfig error。run.sh 會設 FONTCONFIG_FILE 指到這裡 -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir prefix="relative">fonts</dir>
  <cachedir>~/Library/Caches/ai-cut-fontconfig</cachedir>
</fontconfig>
